<html>
<head>
	<meta charset = "utf-8">
	<title>贪吃蛇</title>
	<style>
	#gamefield {border-spacing:0; 
		border-style : solid ;
		border-width : 3px;border-color : black ;
		display : flex;
		flex-wrap:wrap ;
		justify-content : center ; 
		width: 485 ;
		flex-direction:column ;
		align-items:center }
	#countain {flex-wrap:wrap ;
		justify-content:space-between ;
		display:flex ;
		flex-direction:column;
		height:100%}
	#row1{display:flex ;
		justify-content: space-around;}
	#row2{display:flex;
		justify-content:center}
	button { height:1.5em ; width:9em ; text-align:center ;margin :20px}
	</style>
	<script>
		let sk = new Array(3);
		let score = 0;
		let dst = 0;
		let apple = 0;
		let speed = 150;
		document.addEventListener("keydown",function(event){   //键盘事件监听
			let _head = [Math.floor(sk[0]/40),sk[0]%40];
			if(event.keyCode == 87 || event.keyCode == 38){ //w和上 
				if(sk[0]-40 != sk[1]){
					dst = 0;}
			}
			if(event.keyCode == 68 || event.keyCode == 39){ // d 和 右
				if(sk[0]+1 != sk[1]){
					dst = 1;}
			}
			if(event.keyCode == 83 || event.keyCode == 40){ // s和下
				if(sk[0]+40 != sk[1]){
					dst = 2;}
			}
			if(event.keyCode == 65 || event.keyCode == 37){ // a和←
				if(sk[0]-1 != sk[1]){
					dst = 3;}
			}}
		,false);
		function init(){							//初始化
				sk.fill(820);
				let _gfd = document.getElementById("gamefield");
				for(let i = 0; i<40;i++){
					let _tr = document.createElement("tr");
					for(let j = 0;j<40;j++){
						let _td = document.createElement("td");
						let _img = document.createElement("img");
						let _id = i*40+j;
						_td.style.padding = "0";
						_img.src = "0.png";
						_img.id = _id.toString();
						_img.width = "12";
						_img.height = "12";
						_img.className = "sd";
						_td.appendChild(_img);
						_tr.appendChild(_td);}
					_gfd.appendChild(_tr);}
				;}
				
		function reset(){		//重设
			document.getElementById("_spdup").disabled = true;
			document.getElementById("_spddn").disabled = true;
			score = 0;
			sk = Array(3);
			sk.fill(820);
			dst = 0;

			let chesses = document.getElementsByClassName("sd");
			for(let i of chesses){
				i.src = "0.png";}
			document.getElementById("820").src = "1.png";
			layapple()
			game = setInterval("gaming()",speed);
			}
			
		function gaming(){   		//主循环函数
			
			let nxt = 0;              //获取下一个头部位置
			let _head = [Math.floor(sk[0]/40),sk[0]%40];
			if(dst == 0){
				nxt = [_head[0]-1,_head[1]]}
			else if(dst == 1){
				nxt = [_head[0],_head[1]+1];}
			else if(dst == 2){
				nxt = [_head[0]+1,_head[1]];}
			else if(dst == 3){
				nxt = [_head[0],_head[1]-1];}
				
			if(sk.includes(nxt[0]*40+nxt[1]) || nxt[0]<0 || nxt[0]>39 ||nxt[1]<0 || nxt[1]>39){ //失败判断
				document.getElementById("_spdup").disabled = false;
				document.getElementById("_spddn").disabled = false;
				window.clearInterval(game);

				return 0}
				
			if(nxt[0]*40+nxt[1] == apple){   //苹果判断
				score++;
				document.getElementById("sc").innerHTML = "score:"+score.toString();
				sk.push(sk[sk.length-1]);
				layapple();}
				
			sk.unshift(nxt[0]*40+nxt[1]);    //移动
			f_tail = sk.pop();
			document.getElementById(f_tail.toString()).src = "0.png";
			for(i of sk){
			document.getElementById(i.toString()).src = "1.png";}
		}
		function layapple(){         //控制苹果
			while(1){
			apple = Math.floor(Math.random()*41)*40+Math.floor(Math.random()*41);
			if(!sk.includes(apple)){
			break;}}
			document.getElementById(apple).src = "apple.png";
			}
		function spdup(){           //加减速
			if(speed > 50){
			speed-=10;
			document.getElementById("speed").innerHTML = "speed:"+((speed-50)/10).toString()}}
		function spddown(){
			speed+=10;
			document.getElementById("speed").innerHTML = "speed:"+((speed-50)/10).toString()}		
	</script>
</head>
<body onload = "init()">
	<div id = "countain">
	<div id = "row1">
		<button onclick = "reset()" >New game</button>
		<p id = "sc">score:0</p>
		<p id = "speed">speed:10</p>
		
		<div>
		<button id = "_spdup" onclick = "spdup()">加速</button>
		<button id = "_spddn" onclick = "spddown()">减速</button>
		</div>

	</div>
	<div id = "row2">
		<table id = "gamefield">	
		</table>
	</div>
	</div>
</body>

</html>
